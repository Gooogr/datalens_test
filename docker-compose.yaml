version: '3.8'

# https://clickhouse.com/docs/guides/sre/network-ports
services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    env_file:
      - .env
    expose:
      - "8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d
    environment:
      - CLICKHOUSE_DB=$CLICKHOUSE_DB
      - CLICKHOUSE_USER=$CLICKHOUSE_USER
      - CLICKHOUSE_PASSWORD=$CLICKHOUSE_PASSWORD
    networks:
      - internal_net

  nginx:
    image: nginx:stable
    container_name: nginx_clickhouse
    ports:
      - "8123:8123"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/logs:/var/log/nginx/
    depends_on:
      - clickhouse
    networks:
      - internal_net

volumes:
  clickhouse_data:

networks:
  internal_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16 # don't change, used for nginx local proxy
